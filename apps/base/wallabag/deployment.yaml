apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallabag
  namespace: wallabag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wallabag
  template:
    metadata:
      labels:
        app: wallabag
        try: "0"
    spec:
      securityContext:
        fsGroup: 65534 # www-data group ID
        runAsUser: 65534 # www-data user ID
        runAsGroup: 65534 #  www-data group ID

      containers:
        - name: wallabag
          image: docker.io/wallabag/wallabag:latest

          ports:
            - containerPort: 7005
              targetPort: 80
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
