apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-bookshelf
  namespace: audio-bookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audio-bookshelf
  template:
    metadata:
      labels:
        app: audio-bookshelf
    spec:
      securityContext:
        fsGroup: 1000 # www-data group ID
        runAsUser: 1000 # www-data user ID
        runAsGroup: 1000 # www-data group ID

      containers:
        - name: audio-bookshelf
          image: ghcr.io/advplyr/audiobookshelf:latest

          envFrom:
            - configMapRef:
                name: audiobookshelf-configmap

          ports:
            - containerPort: 3005
              targetPort: 80
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false

          volumeMounts:
            - mountPath: /config
              name: audio-bookshelf-config
            - mountPath: /metadata
              name: audio-bookshelf-metadata
            - mountPath: /audiobooks
              name: audio-bookshelf-audiobooks

      volumes:
        - name: audio-bookshelf-config
          persistentVolumeClaim:
            claimName: audio-bookshelf-config
        - name: audio-bookshelf-metadata
          persistentVolumeClaim:
            claimName: audio-bookshelf-metadata
        - name: audio-bookshelf-audiobooks
          persistentVolumeClaim:
            claimName: audio-bookshelf-audiobooks
