apiVersion: apps/v1
kind: Deployment
metadata:
  name: homarr
  namespace: homarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homarr
  template:
    metadata:
      labels:
        app: homarr
        try: "0"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: homarr
          image: ghcr.io/ajnart/homarr:latest

          securityContext:
            allowPrivilegeEscalation: false

          envFrom:
            - configMapRef:
                name: homarr-configmap
                namespace: homarr

          ports:
            - containerPort: 7575
              protocol: TCP

          volumeMounts:
            - name: homarr-config
              mountPath: "/app/data/configs"
            - name: homarr-database
              mountPath: "/app/database"
            - name: homarr-icons
              mountPath: "/app/public/icons"

      restartPolicy: Always

      volumes:
        - name: homarr-config
          persistentVolumeClaim:
            claimName: homarr-config
        - name: homarr-database
          persistentVolumeClaim:
            claimName: homarr-database
        - name: homarr-icons
          persistentVolumeClaim:
            claimName: homarr-icons
